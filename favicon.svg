<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>The tile river</title>
  <!-- glazed tile body, edge slightly uneven -->
  <path d="M5.2 4.6 Q32 3.6 59.1 4.9 Q60.2 32 59.4 59.2 Q32 60.4 4.8 59.3 Q3.8 32 5.2 4.6Z" fill="#eef0ec"/>
  <path d="M5.2 4.6 Q32 3.6 59.1 4.9 Q60.2 32 59.4 59.2 Q32 60.4 4.8 59.3 Q3.8 32 5.2 4.6Z" fill="none" stroke="#b9ab94" stroke-width="1"/>
  <!-- painted double frame -->
  <path d="M8.6 8.4 Q32 7.6 55.5 8.7 Q56.3 32 55.6 55.6 Q32 56.4 8.4 55.5 Q7.7 32 8.6 8.4Z" fill="none" stroke="#1d3a9e" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M11.6 11.5 L52.4 11.7 L52.5 52.4 L11.5 52.3Z" fill="none" stroke="#1d3a9e" stroke-width="0.9" opacity="0.8"/>
  <!-- river bend: pale wash, then banks -->
  <path d="M25 11.7 C25 30 33 39 52.4 39" fill="none" stroke="#8fa6dc" stroke-width="10.5" stroke-linecap="butt"/>
  <path d="M25 11.7 C25 30 33 39 52.4 39" fill="none" stroke="#5f7cc8" stroke-width="5" opacity="0.55"/>
  <path d="M19.4 11.7 C19.6 33 30 44.6 52.4 44.4" fill="none" stroke="#1d3a9e" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M30.6 11.7 C30.8 27.5 37 33.6 52.4 33.5" fill="none" stroke="#1d3a9e" stroke-width="2.1" stroke-linecap="round"/>
  <!-- wavelets -->
  <path d="M23.6 22 q1.4 -1.2 2.8 0 t2.8 0" fill="none" stroke="#1d3a9e" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M37 37.2 q1.4 -1.2 2.8 0 t2.8 0" fill="none" stroke="#1d3a9e" stroke-width="1.1" stroke-linecap="round"/>
  <!-- a small tree on the inside of the bend -->
  <path d="M42.6 26.4 L42.6 19.6" stroke="#1d3a9e" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="42.6" cy="17.4" r="3.6" fill="#8fa6dc" stroke="#1d3a9e" stroke-width="1.2"/>
  <!-- a chipped corner showing the clay -->
  <path d="M59.1 4.9 L52.6 5.1 Q54.8 8.2 59.3 10.4Z" fill="#c9a07c"/>
</svg>
